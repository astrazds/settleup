name: Feature
description: Propose a change to how SettleUp behaves.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        SettleUp has no accounts, no login, and no money movement. Splits stay equal. Describe how the idea fits that boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what should stay the same?
    validations:
      required: true
