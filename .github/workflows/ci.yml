name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Reject stylesheet lengths in the design doc
        run: npm run check:design-doc

      - name: Reject a Cursor agent commit trailer
        run: npm run check:commit-signature

      - name: Verify code and builds
        run: mise run check:code

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright browsers
        run: mise run browsers:install -- --with-deps

      - name: Run end-to-end tests
        run: mise run test:e2e

  windows-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: mise run install
      - name: Install Chromium
        run: mise exec -- npm exec --workspace @settleup/web -- playwright install chromium
      - name: Run the desktop expense workflow
        run: mise run test:e2e -- core-flow.spec.ts --project=desktop-chromium
