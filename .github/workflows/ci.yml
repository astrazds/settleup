name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright browsers
        run: mise run browsers:install -- --with-deps

      - name: Run end-to-end tests
        run: mise run test:e2e
